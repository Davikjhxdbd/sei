services:
  - type: web
    name: mmv-creative-test-web
    runtime: static
    branch: feat/mmv-creative-workflow
    buildCommand: npm ci --prefix web && npm run build --prefix web
    staticPublishPath: web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mmv-creative-test-api.onrender.com

  - type: web
    name: mmv-creative-test-api
    runtime: node
    plan: free
    region: virginia
    branch: feat/mmv-creative-workflow
    rootDir: server
    buildCommand: npm ci --include=dev
    startCommand: npm run migrate && npm run seed && npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mmv-creative-test-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://mmv-creative-test-web.onrender.com
      - key: APP_URL
        value: https://mmv-creative-test-web.onrender.com
      - key: SEED_PASSWORD
        sync: false

databases:
  - name: mmv-creative-test-db
    plan: free
    region: virginia
    postgresMajorVersion: 16
